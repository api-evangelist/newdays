aid: newdays
name: NewDays
description: >-
  NewDays is a cognitive health company backed by General Catalyst that delivers
  a clinically proven, Medicare-covered program for people living with mild
  cognitive impairment (MCI) or dementia. The service pairs a dedicated licensed
  cognitive clinician with AI-guided brain-training exercises delivered remotely
  from home: a free consultation, ongoing telehealth sessions, and
  clinician-supervised AI exercises between visits. NewDays reports that 75% of
  participants showed improved cognitive function on ACE-III assessments and that
  dementia participants delayed symptom progression by more than a year versus an
  untreated baseline. NewDays is a direct-to-patient telehealth offering with no
  public developer program, API, SDKs, or documentation surface; this profile
  captures the company's identity and public web properties for the API Evangelist
  network.
